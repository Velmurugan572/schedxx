name: Sched Backend CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sched_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: |
        cd backend
        npm ci

    - name: Run Prisma Client Generation
      run: |
        cd backend
        npx prisma generate

    - name: Run Sequential Integration & Unit Tests
      env:
        NODE_ENV: test
        NODE_OPTIONS: "--experimental-vm-modules"
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/sched_test"
        REDIS_URL: "redis://localhost:6379"
        JWT_SECRET: "super-secure-production-jwt-secret-key-32-chars-long"
        ENCRYPTION_KEY: "super-secure-enc-key-32-chars-long"
      run: |
        cd backend
        npx jest src/tests/connector-platform.test.js
        npx jest src/tests/schedule.test.js
        npx jest src/tests/ai.test.js
        npx jest src/tests/publisher.test.js
        npx jest src/tests/analytics.test.js
        npx jest src/tests/notification.test.js
        npx jest src/tests/media.test.js
        npx jest src/tests/production-readiness.test.js
